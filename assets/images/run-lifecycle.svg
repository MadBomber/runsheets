<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b95a8"/>
    </marker>
  </defs>

  <!-- The session -->
  <text x="20" y="18" fill="#d9dee8" font-size="12" font-weight="600">The session: one per runsheets process</text>

  <rect x="20" y="36" width="180" height="56" rx="28" fill="#1b2130" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="110" y="60" text-anchor="middle" fill="#a78bfa" font-weight="600">start page</text>
  <text x="110" y="79" text-anchor="middle" fill="#8b95a8" font-size="12">who, and why</text>
  <text x="110" y="110" text-anchor="middle" fill="#8b95a8" font-size="11">--engineer and --why skip it</text>

  <rect x="300" y="36" width="200" height="56" rx="28" fill="#1b2130" stroke="#3ddc97" stroke-width="1.5"/>
  <text x="400" y="60" text-anchor="middle" fill="#3ddc97" font-weight="600">running</text>
  <text x="400" y="79" text-anchor="middle" fill="#8b95a8" font-size="12">runs, notes, session.log</text>

  <rect x="640" y="26" width="170" height="34" rx="17" fill="#1b2130" stroke="#5ab0ff" stroke-width="1.5"/>
  <text x="725" y="48" text-anchor="middle" fill="#5ab0ff" font-weight="600">ended</text>
  <text x="825" y="48" fill="#8b95a8" font-size="12">End session, or Ctrl-C</text>

  <rect x="640" y="72" width="170" height="34" rx="17" fill="#1b2130" stroke="#ffb454" stroke-width="1.5"/>
  <text x="725" y="94" text-anchor="middle" fill="#ffb454" font-weight="600">interrupted</text>
  <text x="825" y="94" fill="#8b95a8" font-size="12">killed; closed at next start</text>

  <line x1="200" y1="64" x2="298" y2="64" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="249" y="56" text-anchor="middle" fill="#8b95a8" font-size="11">POST /session</text>
  <line x1="500" y1="56" x2="638" y2="43" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="500" y1="72" x2="638" y2="89" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Each runbook's run -->
  <text x="20" y="150" fill="#d9dee8" font-size="12" font-weight="600">Each runbook's run inside the session</text>

  <rect x="20" y="186" width="180" height="56" rx="28" fill="#1b2130" stroke="#8b95a8" stroke-width="1.5"/>
  <text x="110" y="210" text-anchor="middle" fill="#d9dee8" font-weight="600">no run</text>
  <text x="110" y="229" text-anchor="middle" fill="#8b95a8" font-size="12">blocks copy only</text>

  <rect x="300" y="186" width="200" height="56" rx="28" fill="#1b2130" stroke="#3ddc97" stroke-width="1.5"/>
  <text x="400" y="210" text-anchor="middle" fill="#3ddc97" font-weight="600">running</text>
  <text x="400" y="229" text-anchor="middle" fill="#8b95a8" font-size="12">execute, mark, switch away</text>
  <text x="400" y="264" text-anchor="middle" fill="#8b95a8" font-size="11">selecting the runbook again returns to the same run</text>

  <line x1="200" y1="214" x2="298" y2="214" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="249" y="206" text-anchor="middle" fill="#8b95a8" font-size="11">POST /runs</text>

  <text x="570" y="168" text-anchor="middle" fill="#8b95a8" font-size="11">when the session ends</text>
  <line x1="500" y1="214" x2="638" y2="178" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="500" y1="214" x2="638" y2="212" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="500" y1="214" x2="638" y2="246" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="500" y1="214" x2="638" y2="280" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)" stroke-dasharray="5 4"/>

  <rect x="640" y="164" width="170" height="28" rx="14" fill="#1b2130" stroke="#3ddc97" stroke-width="1.5"/>
  <text x="725" y="183" text-anchor="middle" fill="#3ddc97" font-weight="600">completed</text>
  <text x="825" y="183" fill="#8b95a8" font-size="12">every step done or skipped</text>

  <rect x="640" y="198" width="170" height="28" rx="14" fill="#1b2130" stroke="#5ab0ff" stroke-width="1.5"/>
  <text x="725" y="217" text-anchor="middle" fill="#5ab0ff" font-weight="600">partial</text>
  <text x="825" y="217" fill="#8b95a8" font-size="12">something done, not all</text>

  <rect x="640" y="232" width="170" height="28" rx="14" fill="#1b2130" stroke="#8b95a8" stroke-width="1.5"/>
  <text x="725" y="251" text-anchor="middle" fill="#d9dee8" font-weight="600">opened</text>
  <text x="825" y="251" fill="#8b95a8" font-size="12">selected, nothing done</text>

  <rect x="640" y="266" width="170" height="28" rx="14" fill="#1b2130" stroke="#ffb454" stroke-width="1.5"/>
  <text x="725" y="285" text-anchor="middle" fill="#ffb454" font-weight="600">interrupted</text>
  <text x="825" y="285" fill="#8b95a8" font-size="12">its session was killed</text>

  <!-- Each execution -->
  <text x="20" y="324" fill="#d9dee8" font-size="12" font-weight="600">Each execution inside a run</text>

  <rect x="20" y="374" width="130" height="44" rx="10" fill="#1b2130" stroke="#8b95a8" stroke-width="1.5"/>
  <text x="85" y="401" text-anchor="middle" fill="#d9dee8">pending</text>
  <text x="85" y="440" text-anchor="middle" fill="#8b95a8" font-size="11">spawn fails → failed</text>

  <rect x="210" y="374" width="130" height="44" rx="10" fill="#1b2130" stroke="#5ab0ff" stroke-width="1.5"/>
  <text x="275" y="401" text-anchor="middle" fill="#5ab0ff">running</text>

  <rect x="430" y="336" width="130" height="36" rx="10" fill="#1b2130" stroke="#3ddc97" stroke-width="1.5"/>
  <text x="495" y="359" text-anchor="middle" fill="#3ddc97">finished</text>
  <text x="580" y="359" fill="#8b95a8" font-size="12">exit_status 0 is success</text>

  <rect x="430" y="378" width="130" height="36" rx="10" fill="#1b2130" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="495" y="401" text-anchor="middle" fill="#ff6b6b">timed_out</text>
  <text x="580" y="401" fill="#8b95a8" font-size="12">TERM group, 2 s, then KILL</text>

  <rect x="430" y="420" width="130" height="36" rx="10" fill="#1b2130" stroke="#ffb454" stroke-width="1.5"/>
  <text x="495" y="443" text-anchor="middle" fill="#ffb454">stopped</text>
  <text x="580" y="443" fill="#8b95a8" font-size="12">Stop, or the session ended; not a failure</text>

  <line x1="150" y1="396" x2="208" y2="396" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="340" y1="388" x2="428" y2="356" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="340" y1="396" x2="428" y2="396" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="340" y1="404" x2="428" y2="436" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
</svg>
