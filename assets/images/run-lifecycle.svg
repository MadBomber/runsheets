<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b95a8"/>
    </marker>
  </defs>

  <!-- Run states -->
  <rect x="20" y="30" width="170" height="64" rx="32" fill="#1b2130" stroke="#8b95a8" stroke-width="1.5"/>
  <text x="105" y="58" text-anchor="middle" fill="#d9dee8" font-weight="600">no active run</text>
  <text x="105" y="78" text-anchor="middle" fill="#8b95a8" font-size="12">blocks copy only</text>

  <rect x="300" y="30" width="200" height="64" rx="32" fill="#1b2130" stroke="#3ddc97" stroke-width="1.5"/>
  <text x="400" y="58" text-anchor="middle" fill="#3ddc97" font-weight="600">running</text>
  <text x="400" y="78" text-anchor="middle" fill="#8b95a8" font-size="12">execute, mark steps</text>

  <rect x="610" y="10" width="170" height="52" rx="26" fill="#1b2130" stroke="#3ddc97" stroke-width="1.5"/>
  <text x="695" y="42" text-anchor="middle" fill="#3ddc97" font-weight="600">completed</text>

  <rect x="610" y="72" width="170" height="52" rx="26" fill="#1b2130" stroke="#ffb454" stroke-width="1.5"/>
  <text x="695" y="104" text-anchor="middle" fill="#ffb454" font-weight="600">abandoned</text>

  <line x1="190" y1="62" x2="298" y2="62" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="244" y="52" text-anchor="middle" fill="#8b95a8" font-size="11">POST /run</text>

  <line x1="500" y1="52" x2="608" y2="38" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="500" y1="72" x2="608" y2="96" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="554" y="34" text-anchor="middle" fill="#8b95a8" font-size="11">POST /run/finish</text>

  <!-- Execution states, below -->
  <text x="20" y="150" fill="#d9dee8" font-size="12" font-weight="600">Each execution inside a run</text>

  <rect x="20" y="170" width="130" height="50" rx="10" fill="#1b2130" stroke="#8b95a8" stroke-width="1.5"/>
  <text x="85" y="200" text-anchor="middle" fill="#d9dee8">pending</text>

  <rect x="210" y="170" width="130" height="50" rx="10" fill="#1b2130" stroke="#5ab0ff" stroke-width="1.5"/>
  <text x="275" y="200" text-anchor="middle" fill="#5ab0ff">running</text>

  <rect x="430" y="140" width="130" height="44" rx="10" fill="#1b2130" stroke="#3ddc97" stroke-width="1.5"/>
  <text x="495" y="167" text-anchor="middle" fill="#3ddc97">finished</text>
  <text x="600" y="167" fill="#8b95a8" font-size="12">exit_status 0 is success</text>

  <rect x="430" y="196" width="130" height="44" rx="10" fill="#1b2130" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="495" y="223" text-anchor="middle" fill="#ff6b6b">timed_out</text>
  <text x="600" y="223" fill="#8b95a8" font-size="12">TERM group, 2 s, then KILL</text>

  <rect x="210" y="236" width="130" height="20" rx="6" fill="none" stroke="none"/>
  <rect x="640" y="236" width="0" height="0"/>

  <rect x="20" y="236" width="130" height="0"/>

  <line x1="150" y1="195" x2="208" y2="195" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="340" y1="188" x2="428" y2="166" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="340" y1="202" x2="428" y2="216" stroke="#8b95a8" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <text x="85" y="245" text-anchor="middle" fill="#8b95a8" font-size="11">spawn fails → failed</text>
</svg>
